apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-config
  namespace: payments
data:
  DATABASE_URL: "postgres://payments:payments@postgres.payments.svc:5432/payments"
  LOG_LEVEL: "info"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-api-src
  namespace: payments
data:
  server.py: |
    import json
    import os
    import sys
    from http.server import BaseHTTPRequestHandler, HTTPServer

    REQUIRED = ["DATABASE_URL"]
    missing = [k for k in REQUIRED if not os.environ.get(k)]
    if missing:
        print(f"FATAL: missing required environment variable(s): {', '.join(missing)}", flush=True)
        print("payments-api cannot start without a database connection string", flush=True)
        sys.exit(1)

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            body = json.dumps({"service": "payments-api", "status": "ok"}).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, fmt, *args):
            print("payments-api %s" % (fmt % args), flush=True)

    print("payments-api listening on :8080", flush=True)
    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
